# ABOUTME: Docker Compose configuration for dev environment
# ABOUTME: Uses testnet-10, bots enabled, standard ports

networks:
  caddy_net:
    external: true
    name: caddy_caddy_net

services:
  backend:
    # dev-distinct name + host ports so this runs ALONGSIDE the live mainnet prod stack
    # (lucky-chamber-backend on 4200-4202) without conflict. Caddy reaches it by container
    # name on caddy_net, so the published host ports are only for direct/debug access.
    container_name: lucky-chamber-backend-dev
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "4211:4201"
      - "4212:4202"
    networks:
      - caddy_net
      - default
    environment:
      - NODE_ENV=production
      - PORT=4201
      - NETWORK=${NETWORK:-testnet-10}
      - WALLET_MNEMONIC=${WALLET_MNEMONIC}
      - TREASURY_ADDRESS=${TREASURY_ADDRESS}
      - HOUSE_CUT_PERCENT=${HOUSE_CUT_PERCENT:-5}
      - BOTS_ENABLED=${BOTS_ENABLED:-true}
      - MIN_CONFIRMATIONS=${MIN_CONFIRMATIONS:-1}
      - SETTLEMENT_BLOCK_OFFSET=${SETTLEMENT_BLOCK_OFFSET:-5}
      - DB_PATH=/app/data/game.db
      # Non-custodial covenant custody (KSNV-158). The prebuilt Linux emitter is mounted below.
      - COVENANT_ENABLED=true
      - LC_HARNESS_BIN=/opt/lc-harness/deploy_artifacts
    volumes:
      - backend_data:/app/data
      # Prebuilt x86_64-linux covenant binaries (deploy_artifacts + fund_sign), cross-compiled off-host.
      - ./covenant-harness/bin-linux:/opt/lc-harness:ro
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:4201/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    container_name: lucky-chamber-frontend-dev
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # Same-domain routing (Caddy: /api/* -> backend:4201, ws -> backend:4202, else frontend:4200).
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://dev.theluckychamber.com}
        - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-wss://dev.theluckychamber.com}
        - NEXT_PUBLIC_NETWORK=${NEXT_PUBLIC_NETWORK:-testnet-10}
        - NEXT_PUBLIC_EXPLORER_URL=${NEXT_PUBLIC_EXPLORER_URL:-https://tn10.kaspa.stream}
        - NEXT_PUBLIC_KASANOVA_DEEPLINK=${NEXT_PUBLIC_KASANOVA_DEEPLINK:-https://dev-go.kasanova.app/theluckychamber}
        # Non-custodial covenant deposits (Kasware signPskt 0x81 into the L1 P2SH pot).
        - NEXT_PUBLIC_COVENANT_DEPOSITS=true
    ports:
      - "4210:4200"
    environment:
      - NODE_ENV=production
    networks:
      - caddy_net
      - default
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  backend_data:
