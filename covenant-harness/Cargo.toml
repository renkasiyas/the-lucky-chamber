# ABOUTME: Rust differential-test harness for the Lucky Chamber covenant redeem scripts.
# ABOUTME: Compiles SilverScript via silverscript-lang, executes vs LOCAL rusty-kaspa v2.0.1 txscript VM (patched, ground truth).
[package]
name = "lucky-chamber-harness"
version = "0.0.0"
edition = "2024"
publish = false

[[bin]]
name = "smoke"
path = "src/bin/smoke.rs"

[[bin]]
name = "resolve_diff"
path = "src/bin/resolve_diff.rs"

[[bin]]
name = "forfeit_diff"
path = "src/bin/forfeit_diff.rs"

[[bin]]
name = "combined_blob"
path = "src/bin/combined_blob.rs"

[[bin]]
name = "oracle_vectors"
path = "src/bin/oracle_vectors.rs"

[dependencies]
# Local patched fork (covenants_enabled builders) so the ONE combined 63-branch blob can be emitted.
# Upstream KasBonds copy kept pristine. See vendor/silverscript-lang/Cargo.toml for the single-change rationale.
silverscript-lang = { path = "vendor/silverscript-lang" }
secp256k1 = { version = "0.29.0", features = ["global-context", "rand-std"] }
kaspa-txscript = { path = "/Volumes/OdessaExt/Kasanova/reference/rusty-kaspa/crypto/txscript" }
kaspa-txscript-errors = { path = "/Volumes/OdessaExt/Kasanova/reference/rusty-kaspa/crypto/txscript/errors" }
kaspa-consensus-core = { path = "/Volumes/OdessaExt/Kasanova/reference/rusty-kaspa/consensus/core" }
kaspa-hashes = { path = "/Volumes/OdessaExt/Kasanova/reference/rusty-kaspa/crypto/hashes" }
kaspa-addresses = { path = "/Volumes/OdessaExt/Kasanova/reference/rusty-kaspa/crypto/addresses" }
blake2b_simd = "1"
serde_json = "1"
sha2 = "0.10"

# NOTE: we deliberately do NOT [patch] silverscript's tn12 deps to v2.0.1.
# v2.0.1 `EngineFlags::default().covenants_enabled = false` (lib.rs:133) makes silverscript's
# constant-baking (`ScriptBuilder::new()` + `add_data_with_push_opcode`) reject under v2.0.1.
# So silverscript COMPILES with its native tn12 ScriptBuilder (codegen works), and we EXECUTE the
# emitted opcode bytes on LOCAL v2.0.1 (our direct path deps below) — the compiled Vec<u8> is the
# deployment artifact; no txscript types cross the boundary. Ground-truth execution stays on v2.0.1.

[workspace]
# Standalone workspace so this crate is not swept into any parent workspace.
