# ABOUTME: Local patched fork of silverscript-lang for the Lucky Chamber covenant harness.
# ABOUTME: ONLY change vs upstream: compiler builders use covenants_enabled=true (cap 10k->1M) so the
# ABOUTME: single combined 63-branch redeem blob can be emitted. covenants_enabled affects size caps ONLY,
# ABOUTME: not emitted bytes (verified in tn12 crypto/txscript/src/script_builder.rs) -> byte-faithful output.
# Upstream: research/KasBonds-research/vendor/silverscript/silverscript-lang (kept pristine).
[package]
name = "silverscript-lang"
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Kaspa developers"]
rust-version = "1.85.0"

[lib]
name = "silverscript_lang"
path = "src/lib.rs"

[dependencies]
kaspa-consensus-core = { git = "https://github.com/kaspanet/rusty-kaspa", branch = "tn12" }
kaspa-hashes = { git = "https://github.com/kaspanet/rusty-kaspa", branch = "tn12" }
kaspa-txscript = { git = "https://github.com/kaspanet/rusty-kaspa", branch = "tn12" }
kaspa-txscript-errors = { git = "https://github.com/kaspanet/rusty-kaspa", branch = "tn12" }
blake2b_simd = "1.0.2"
indexmap = "2.7.0"
chrono = { version = "0.4", default-features = false, features = ["std"] }
pest = "2.7"
pest_derive = "2.7"
rand = "0.8.5"
secp256k1 = { version = "0.29.0", features = ["global-context", "rand-std", "serde"] }
thiserror = "1.0.61"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
faster-hex = "0.10"
semver = "1.0"
